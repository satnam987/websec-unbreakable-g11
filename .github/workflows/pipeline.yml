name: pipeline

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # DSOMM: Software Composition Analysis (server side) - L2
  sca:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  # DSOMM: Static analysis for important server side components - L3
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep scan --config=auto --error --severity=ERROR

  # DSOMM: Test for stored secrets in code - L1
  # Scant de volledige git-historiek (de action scande enkel de nieuwe commits van een push)
  secrets:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks (volledige historiek)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gl.tgz" | sha256sum -c
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --redact -v

  # Deploy: enkel na geslaagde scans, enkel bij push naar main
  deploy:
    name: Deploy to g11
    runs-on: self-hosted
    needs: [sca, sast, secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Deploy with docker compose
        run: |
          cd ~/websec-unbreakable-g11
          git pull
          docker compose up -d --build
